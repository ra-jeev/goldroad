# Google Play capture flow (Pixel 9 Pro AVD "Pixel_9_Pro_goldie", 1280x2856).
# Needs the screenshot build: ./gradlew :app:assembleProductionScreenshot
# (mobile/android/app/src/screenshot/.../Demo.kt), which plays the local demo road
# (the Day #100 boards) with a sample history on every launch. Coordinates come
# from describe on that emulator: tile centre x = 0.1055 + 0.1577*col, y = 0.341 + 0.0708*row.
