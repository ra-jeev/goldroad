executionPrerequisite: >-
  Classic board, 17 tiles walked.
# App Store capture flow. Needs the screenshot-mode simulator build: the
# device's data folder holds a GoldRoadScreenshotMode file (see
# mobile/ios/GoldRoad/ScreenshotMode.swift), so the app serves a local demo
# road (the Day #100 boards) and a sample history. argent native devtools
# cannot attach to this app, so every step is a coordinate on the
# iPhone 17 Pro Max, read from describe.
