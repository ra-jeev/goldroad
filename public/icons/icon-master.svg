<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1a0e03"/>
      <stop offset="55%" stop-color="#110900"/>
      <stop offset="100%" stop-color="#0d0702"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c84a"/>
      <stop offset="55%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- mini road: circular coin tiles joined by gold roads, like the board -->
  <g id="icon-art">
    <!-- roads -->
    <path d="M150 362 H362 V150" fill="none" stroke="url(#goldGrad)"
          stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- start tile: the bright, current coin -->
    <circle cx="150" cy="362" r="56" fill="url(#goldGrad)" stroke="#0d0702" stroke-width="8"/>

    <!-- corner tile: open coin -->
    <circle cx="362" cy="362" r="56" fill="#110900" stroke="url(#goldGrad)" stroke-width="14"/>

    <!-- finish tile: open coin carrying the flag -->
    <circle cx="362" cy="150" r="56" fill="#110900" stroke="url(#goldGrad)" stroke-width="14"/>
    <g fill="#e8c84a">
      <rect x="344" y="122" width="9" height="58" rx="4"/>
      <path d="M353 126 L392 138 L353 152 Z"/>
    </g>
  </g>
</svg>
