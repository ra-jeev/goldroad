<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bgGrad" cx="30%" cy="45%" r="85%">
      <stop offset="0%" stop-color="#1a0e03"/>
      <stop offset="55%" stop-color="#110900"/>
      <stop offset="100%" stop-color="#0d0702"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c84a"/>
      <stop offset="55%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- mini-road mark: circular coin tiles joined by gold roads -->
  <g transform="translate(190 315)">
    <path d="M-120 120 H120 V-120" fill="none" stroke="url(#goldGrad)"
          stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-120" cy="120" r="46" fill="url(#goldGrad)" stroke="#0d0702" stroke-width="7"/>
    <circle cx="120" cy="120" r="46" fill="#110900" stroke="url(#goldGrad)" stroke-width="12"/>
    <circle cx="120" cy="-120" r="46" fill="#110900" stroke="url(#goldGrad)" stroke-width="12"/>
    <g fill="#e8c84a">
      <rect x="105" y="-143" width="8" height="48" rx="3.5"/>
      <path d="M113 -140 L146 -130 L113 -118 Z"/>
    </g>
  </g>

  <text x="430" y="300" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="88" font-weight="700" fill="#d4af37">GoldRoad</text>
  <text x="432" y="360" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="34" fill="#e8c84a" opacity="0.85">One road. One score. Every day.</text>
</svg>
